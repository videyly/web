<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="video.other">
<meta property="og:title" content="Video Player">
<meta property="og:video:type" content="video/mp4">
<title>Video Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:monospace}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;z-index:1}

/* TOP OVERLAY */
.ov{position:fixed;top:0;left:0;right:0;padding:12px 16px;
  background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);
  display:flex;align-items:center;justify-content:flex-end;
  opacity:0;transition:opacity .3s;z-index:10;pointer-events:none}
.ov.show{opacity:1;pointer-events:auto}
.top-right{display:flex;align-items:center;gap:8px}
.wa-btn{display:flex;align-items:center;gap:5px;background:rgba(37,211,102,.15);
  border:1px solid rgba(37,211,102,.35);color:#25d366;
  font-size:.6rem;padding:5px 11px;border-radius:999px;
  text-decoration:none;transition:all .2s;white-space:nowrap}
.wa-btn svg{width:13px;height:13px;fill:#25d366;flex-shrink:0}
.tg-btn{display:flex;align-items:center;gap:5px;background:rgba(0,136,204,.15);
  border:1px solid rgba(0,136,204,.35);color:#29b6f6;
  font-size:.6rem;padding:5px 11px;border-radius:999px;
  text-decoration:none;transition:all .2s;white-space:nowrap}
.tg-btn svg{width:13px;height:13px;fill:#29b6f6;flex-shrink:0}
.cp{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.6);font-size:.6rem;
  padding:5px 11px;border-radius:999px;cursor:pointer;transition:all .2s}
.cp:hover{border-color:#00e5ff;color:#00e5ff}

/* PLAY GATE (awal) */
.gate{position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.75);backdrop-filter:blur(5px)}
.play-btn{width:70px;height:70px;border-radius:50%;
  background:rgba(0,229,255,.12);border:2px solid #00e5ff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .2s,background .2s}
.play-btn:hover{transform:scale(1.1);background:rgba(0,229,255,.22)}
.play-btn svg{width:28px;height:28px;fill:#00e5ff;margin-left:5px}

/* BOTTOM CONTROLS */
.controls{position:fixed;bottom:0;left:0;right:0;z-index:10;
  padding:10px 14px 14px;
  background:linear-gradient(to top,rgba(0,0,0,.85),transparent);
  opacity:0;transition:opacity .3s;pointer-events:none}
.controls.show{opacity:1;pointer-events:auto}

.seek-wrap{position:relative;height:20px;display:flex;align-items:center;margin-bottom:8px;cursor:pointer}
.seek-bg{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.2);border-radius:2px}
.seek-buf{position:absolute;left:0;height:3px;background:rgba(255,255,255,.3);border-radius:2px;width:0%}
.seek-prog{position:absolute;left:0;height:3px;background:#00e5ff;border-radius:2px;width:0%}
.seek-thumb{position:absolute;width:13px;height:13px;border-radius:50%;
  background:#00e5ff;top:50%;transform:translate(-50%,-50%);left:0%;
  box-shadow:0 0 8px rgba(0,229,255,.6)}

.ctrl-row{display:flex;align-items:center;gap:8px}
.ctrl-btn{background:none;border:none;color:#fff;cursor:pointer;
  font-size:.75rem;padding:4px 6px;border-radius:6px;
  transition:background .2s;display:flex;align-items:center;gap:3px}
.ctrl-btn:hover{background:rgba(255,255,255,.1)}
.ctrl-btn svg{width:16px;height:16px;fill:#fff;flex-shrink:0}
.time-display{font-size:.6rem;color:rgba(255,255,255,.7);white-space:nowrap}
.speed-btn{font-size:.6rem;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);
  padding:3px 8px;border-radius:999px;cursor:pointer;transition:all .2s}

.speed-btn.active{background:rgba(0,229,255,.2);border-color:#00e5ff;color:#00e5ff}
.vol-wrap{display:flex;align-items:center;gap:5px;margin-left:auto}
.vol-slider{-webkit-appearance:none;appearance:none;
  width:55px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;cursor:pointer}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
  border-radius:50%;background:#00e5ff;cursor:pointer}

/* MODAL PAUSE */
.pause-modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);
  visibility:hidden;opacity:0;transition:visibility 0.2s,opacity 0.2s;cursor:pointer}
.pause-modal.active{visibility:visible;opacity:1}
.modal-card{text-align:center;background:rgba(10,20,28,0.95);border-radius:40px;
  padding:32px 28px;border:1px solid rgba(0,229,255,0.6);
  box-shadow:0 0 40px rgba(0,229,255,0.3);backdrop-filter:blur(8px);
  transform:scale(0.96);transition:transform 0.2s ease;
  max-width:300px;width:82%;cursor:default}
.pause-modal.active .modal-card{transform:scale(1)}
.modal-icon{font-size:52px;margin-bottom:12px;display:inline-block;
  filter:drop-shadow(0 0 8px #00e5ff);animation:pulse 1.2s infinite}
@keyframes pulse{
  0%{opacity:0.7;transform:scale(0.98)}
  100%{opacity:1;transform:scale(1.02)}
}
.modal-text{color:#fff;font-size:1.3rem;font-weight:600;letter-spacing:0.5px;
  margin-bottom:8px;font-family:system-ui,-apple-system,monospace}
.modal-sub{color:rgba(255,255,255,0.7);font-size:0.75rem;margin-bottom:24px}
.modal-btn{background:linear-gradient(135deg,#00e5ff,#0099cc);border:none;
  color:#000;font-weight:700;padding:12px 28px;border-radius:60px;font-size:1rem;
  cursor:pointer;transition:0.2s;box-shadow:0 0 16px rgba(0,229,255,0.6);font-family:monospace}
.modal-btn:hover{transform:scale(1.02);background:linear-gradient(135deg,#33ebff,#00b3e6);
  box-shadow:0 0 20px #00e5ff}
</style>
</head>
<body>

<video id="v" playsinline preload="auto"></video>

<!-- TOP OVERLAY -->
<div class="ov" id="ov">
  <div class="top-right">
    <a class="wa-btn" href="https://whatsapp.com/channel/0029Vb8ChKa7DAX46P1E1d0c" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.121 1.531 5.858L.057 23.428a.75.75 0 00.915.915l5.57-1.474A11.942 11.942 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.726 9.726 0 01-4.953-1.355l-.355-.212-3.683.974.974-3.562-.233-.368A9.724 9.724 0 012.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/></svg>
      WA Channel
    </a>
    <a class="tg-btn" href="https://t.me/+gThSAc1EB6A0NzY1" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>

Telegram
    </a>
    <button class="cp" onclick="copyLink(this)">⎘ Copy</button>
  </div>
</div>

<!-- PLAY GATE -->
<div class="gate" id="gate">
  <div class="play-btn" onclick="startPlay()">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </div>
</div>

<!-- BOTTOM CONTROLS -->
<div class="controls" id="ctrl">
  <div class="seek-wrap" id="seekWrap">
    <div class="seek-bg"></div>
    <div class="seek-buf" id="seekBuf"></div>
    <div class="seek-prog" id="seekProg"></div>
    <div class="seek-thumb" id="seekThumb"></div>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn" onclick="togglePlay()">
      <svg id="ppIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="ctrl-btn" onclick="seek(-10)">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      <span style="font-size:.55rem">10</span>
    </button>
    <button class="ctrl-btn" onclick="seek(10)">
      <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
      <span style="font-size:.55rem">10</span>
    </button>
    <span class="time-display" id="timeDisp">0:00 / 0:00</span>
    <div style="display:flex;gap:4px;margin-left:auto">
      <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
      <button class="speed-btn active" onclick="setSpeed(1)">1x</button>
      <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
      <button class="speed-btn" onclick="setSpeed(2)">2x</button>
    </div>
    <div class="vol-wrap">
      <svg width="13" height="13" fill="rgba(255,255,255,.5)" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input class="vol-slider" type="range" min="0" max="1" step="0.05" value="1" oninput="v.volume=this.value">
    </div>
  </div>
</div>

<!-- MODAL PAUSE -->
<div id="ppauseodal class="pause-modal">
  <div class="modal-card">
    <div class="modal-icon">⏸️</div>
    <div class="modal-text">Video dijeda</div>
    <div class="modal-sub">Klik tombol di bawah untuk melanjutkan</div>
    <button class="modal-btn" id="resumeBtn">▶ Klik untuk lanjutkan</button>
  </div>
</div>

<script>
// =====================================================================
// ⚙️  KONFIGURASI - SESUAIKAN DUA BARIS INI
// =====================================================================
var SITE_DOMAIN = 'videyly.org';           // domain kamu (tanpa https://)
var CDN_BASE    = 'https://cdn2.videy.co/'; // base URL CDN video
// =====================================================================

var path = window.location.pathname;
var id   = path.replace(/^\/+|\/+$/g,'').replace(/\.mp4$/i,'');

// Jika tidak ada ID (halaman root), tampilkan pesan
if (!id) {
  document.body.innerHTML = '<div style="position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.5);text-align:center;padding:24px;font-family:monospace"><div style="font-size:2rem">📺</div><div>Masukkan ID video di URL</div><div style="font-size:.7rem">Contoh: ' + window.location.host + '/abc123</div></div>';
}

var cdnUrl   = CDN_BASE + id + '.mp4';
var shareUrl = 'https://' + SITE_DOMAIN + '/' + id;
document.title = id ? id + ' — ' + SITE_DOMAIN : SITE_DOMAIN;

var v          = document.getElementById('v');
var ov         = document.getElementById('ov');
var gate       = document.getElementById('gate');
var ctrl       = document.getElementById('ctrl');
var pauseModal = document.getElementById('pauseModal');
var resumeBtn  = document.getElementById('resumeBtn');
if (id) v.src = cdnUrl;

// ========== KONFIGURASI IKLAN DI DETIK TERTENTU ==========
var adUrls = {
  3:  'https://s.shopee.co.id/60O95bWrsm',
  15: 'https://omg10.com/4/10963400',
  25: 'https://omg10.com/4/9703244'
};
// =========================================================

var adFired = {};
var isWaitingForResume = false;
var pendingAdUrl = null;

for (var k in adUrls) {
  if (adUrls.hasOwnProperty(k) && parseInt(k) !== 0) {
    adFired[parseInt(k)] = false;
  }
}
adFired[0] = true;

function showPauseAndWait(adUrl) {
  if (isWaitingForResume) return;
  if (!v.paused) v.pause();
  pendingAdUrl = adUrl;
  isWaitingForResume = true;
  pauseModal.classList.add('active');
  showUI();
}

function resumeAndDirect() {
  if (!isWaitingForResume) return;
  if (pendingAdUrl) {
    window.open(pendingAdUrl, '_blank', 'noopener,noreferrer');
    pendingAdUrl = null;
  }
  pauseModal.classList.remove('active');
  isWaitingForResume = false;
  v.play().catch(function(e){ console.log('play error', e); });
  showUI();
}

resumeBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  resumeAndDirect();
});
pauseModal.addEventListener('click', function(e) {
  if (e.target === pauseModal) resumeAndDirect();
});

v.addEventListener('timeupdate', function() {
  if (isWaitingForResume) return;
  var t = Math.floor(v.currentTime);
  var times = Object.keys(adUrls).map(Number).sort(function(a,b){ return a-b; });
  for (var i = 0; i < times.length; i++) {
    var s = times[i];
    if (s === 0) continue;
    if (!adFired[s] && t >= s) {
      adFired[s] = true;
      showPauseAndWait(adUrls[s]);
      return;
    }
  }
});

function startPlay() {
  gate.style.display = 'none';
  v.play().catch(function(e){ console.log('play error:', e); });
  showUI();
}

var seekProg  = document.getElementById('seekProg');
var seekBuf   = document.getElementById('seekBuf');
var seekThumb = document.getElementById('seekThumb');
var seekWrap  = document.getElementById('seekWrap');
var isDrag = false;

v.addEventListener('timeupdate', function() {
  if (isDrag || !v.duration) return;
  var p = v.currentTime / v.duration * 100;
  seekProg.style.width = p + '%';
  seekThumb.style.left = p + '%';
  document.getElementById('timeDisp').textContent = fmtTime(v.currentTime) + ' / ' + fmtTime(v.duration);
});
v.addEventListener('progress', function() {
  if (!v.duration) return;
  try {
    if (v.buffered.length)
      seekBuf.style.width = (v.buffered.end(v.buffered.length-1) / v.duration * 100) + '%';
  } catch(e){}
});

function fmtTime(s) {
  if (isNaN(s)) s = 0;
  var m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
function doSeekAt(e) {
  var rect = seekWrap.getBoundingClientRect();
  var x = (e.clientX !== undefined ? e.clientX : (e.touches ? e.touches[0].clientX : e.pageX)) - rect.left;
  var p = Math.max(0, Math.min(1, x / rect.width));
  if (v.duration) v.currentTime = p * v.duration;
  seekProg.style.width = (p*100) + '%';
  seekThumb.style.left = (p*100) + '%';
}
seekWrap.addEventListener('mousedown', function(e){ isDrag=true; doSeekAt(e); });
seekWrap.addEventListener('touchstart', function(e){ isDrag=true; doSeekAt(e.touches[0]); },{passive:true});
document.addEventListener('mousemove', function(e){ if(isDrag) doSeekAt(e); });
document.addEventListener('touchmove', function(e){ if(isDrag) doSeekAt(e.touches[0]); },{passive:true});
document.addEventListener('mouseup',   function(){ isDrag=false; });
document.addEventListener('touchend',  function(){ isDrag=false; });

function seek(s) {
  if (v.duration) v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime+s));
}
var ppIcon = document.getElementById('ppIcon');
function togglePlay() {
  if (v.paused) {
    if (isWaitingForResume) { resumeAndDirect(); return; }
    v.play();
  } else {
    v.pause();
  }
}
v.addEventListener('play',  function(){ ppIcon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; showUI(); });
v.addEventListener('pause', function(){ ppIcon.innerHTML='<path d="M8 5v14l11-7z"/>'; showUI(); });

function setSpeed(s) {
  v.playbackRate = s;
  document.querySelectorAll('.speed-btn').forEach(function(b){
    b.classList.toggle('active', b.textContent === s+'x');
  });
}

var uiTimer;
function showUI() {
  ov.classList.add('show');
  ctrl.classList.add('show');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(function(){
    if (!v.paused && !isWaitingForResume){
      ov.classList.remove('show');
      ctrl.classList.remove('show');
    }
  }, 3500);
}
document.addEventListener('touchstart', showUI);
document.addEventListener('mousemove',  showUI);
v.addEventListener('pause', function(){
  ov.classList.add('show');
  ctrl.classList.add('show');
  clearTimeout(uiTimer);
});

var lastTap=0, tapTmr;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if (now-lastTap < 300){
    clearTimeout(tapTmr);
    seek(e.changedTouches[0].clientX < window.innerWidth/2 ? -10 : 10);
  } else {
    tapTmr = setTimeout(function(){},300);
  }
  lastTap = now;
});

function copyLink(b) {
  navigator.clipboard.writeText(shareUrl).then(function(){
    var o = b.textContent; b.textContent='✓ OK!';
    setTimeout(function(){ b.textContent=o; }, 2000);
  });
}

v.addEventListener('error', function(){
  document.body.innerHTML='<div style="position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#ff4d6d;text-align:center;padding:24px;font-family:monospace"><div style="font-size:2rem">⚠</div><div>Video tidak ditemukan</div><a href="/" style="margin-top:8px;color:#00e5ff;font-size:.7rem;text-decoration:none">← Kembali</a></div>';
});
</script>
</body>
  </html>
